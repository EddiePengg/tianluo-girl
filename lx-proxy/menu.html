<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
body{margin:0;background:#0d1117;color:#e6edf3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 52px;box-sizing:border-box;overflow:hidden}
h1{font-size:clamp(40px,6vw,76px);margin:0 0 8px;color:#58a6ff}
.date{font-size:clamp(22px,3vw,32px);color:#8b949e;margin-bottom:44px}
.meal{margin-bottom:40px}
.meal h2{font-size:clamp(32px,4.6vw,54px);color:#f0883e;margin:0 0 18px;border-left:8px solid #f0883e;padding-left:16px}
.item{font-size:clamp(26px,3.7vw,42px);line-height:1.85;padding-left:30px;position:relative}
.item::before{content:"◆";position:absolute;left:0;color:#1f6feb}
.item small{color:#8b949e;font-size:.72em;margin-left:12px}
</style></head><body>
<h1>今日菜谱</h1><div class="date">2026-11-12 星期四</div>
<div class="meal"><h2>午饭</h2>
<div class="item">煮饺子 + 虾米<small>电饭煲·跳闸焖2分钟</small></div>
<div class="item">微波大白菜 + 青椒<small>高火3分钟</small></div>
<div class="item">炸鲅鱼<small>180℃ / 10-12分钟</small></div></div>
<div class="meal"><h2>晚饭</h2>
<div class="item">萝卜虾皮汤<small>水开煮10分钟</small></div>
<div class="item">微波地瓜<small>切1cm片·高火5分钟</small></div>
<div class="item">烤三文鱼头 + 豆角<small>180℃ / 15分钟·豆角必须熟透</small></div></div>
</body></html>
